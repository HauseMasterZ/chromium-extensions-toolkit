name: Auto Update Upstream Dependencies

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest DarkReader
        run: |
          echo "Fetching latest darkreader.min.js from jsDelivr..."
          curl -sSL "https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js" -o Toolkit/darkreader.js.new
          if [ -s Toolkit/darkreader.js.new ]; then
            mv Toolkit/darkreader.js.new Toolkit/darkreader.js
          else
            echo "Failed to fetch darkreader.min.js"
            rm -f Toolkit/darkreader.js.new
          fi

      - name: Fetch Latest ClearURLs Rules
        run: |
          echo "Fetching latest ClearURLs rules..."
          curl -sSL "https://rules2.clearurls.xyz/data.minify.json" -o Toolkit/clearurls-rules.json.new
          if [ -s Toolkit/clearurls-rules.json.new ]; then
            mv Toolkit/clearurls-rules.json.new Toolkit/clearurls-rules.json
          else
            echo "Failed to fetch ClearURLs rules"
            rm -f Toolkit/clearurls-rules.json.new
          fi

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clean up any accidental root-level duplicates if present
          git rm -f darkreader.js clearurls-rules.json 2>/dev/null || true
          
          git add Toolkit/darkreader.js Toolkit/clearurls-rules.json
          if git diff --staged --quiet; then
            echo "No updates detected. Repository is already up-to-date."
          else
            git commit -m "chore(deps): auto-update upstream dependencies [skip ci]"
            git push
          fi
