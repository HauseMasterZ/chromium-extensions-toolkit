name: Auto Update Upstream Dependencies

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest DarkReader
        run: |
          echo "Fetching latest darkreader.min.js from jsDelivr..."
          curl -sSL "https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js" -o Toolkit/darkreader.js.new
          if [ -s Toolkit/darkreader.js.new ]; then
            mv Toolkit/darkreader.js.new Toolkit/darkreader.js
          else
            echo "Failed to fetch darkreader.min.js"
            rm -f Toolkit/darkreader.js.new
          fi

      - name: Fetch Latest ClearURLs Rules
        run: |
          echo "Fetching latest ClearURLs rules..."
          curl -sSL "https://rules2.clearurls.xyz/data.minify.json" -o Toolkit/clearurls-rules.json.new
          if [ -s Toolkit/clearurls-rules.json.new ]; then
            mv Toolkit/clearurls-rules.json.new Toolkit/clearurls-rules.json
          else
            echo "Failed to fetch ClearURLs rules"
            rm -f Toolkit/clearurls-rules.json.new
          fi

      - name: Fetch Latest Shorteners List
        run: |
          echo "Fetching latest shorteners list from HaGeZi's DNS blocklists..."
          curl -sSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/urlshortener-onlydomains.txt" -o shorteners_raw.txt
          if [ -s shorteners_raw.txt ]; then
            python3 -c "import json; lines = [l.strip().lower() for l in open('shorteners_raw.txt') if l.strip() and not l.strip().startswith('#')]; open('Toolkit/shorteners-rules.json', 'w').write(json.dumps(lines))"
            rm -f shorteners_raw.txt
          else
            echo "Failed to fetch shorteners list"
            rm -f shorteners_raw.txt
          fi

      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clean up any accidental root-level duplicates if present
          git rm -f darkreader.js clearurls-rules.json shorteners-rules.json 2>/dev/null || true
          
          git add Toolkit/darkreader.js Toolkit/clearurls-rules.json Toolkit/shorteners-rules.json
          if git diff --staged --quiet; then
            echo "No updates detected. Repository is already up-to-date."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(deps): auto-update upstream dependencies [skip ci]"
            git push
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Package Extension & Create GitHub Release
        if: steps.commit_step.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Packaging extension into ZIP archive..."
          cd Toolkit
          zip -r ../toolkit-extension.zip . -x ".*" -x "__MACOSX/*"
          cd ..

          TAG_NAME="v$(date -u +'%Y.%m.%d-%H%M')"
          RELEASE_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          cat <<EOF > release_notes.md
## 🚀 Automated Dependencies & Engine Build

**Updated at:** \`$RELEASE_TIME\`

---

### 📦 Upstream Data & Dependency Status
* **DarkReader**: Upstream \`darkreader.js\` compiled bundle
* **ClearURLs Rule Definitions**: Latest \`clearurls-rules.json\` tracking parameter filters
* **HaGeZi URL Shortener Dataset**: \`shorteners-rules.json\` containing **9,900+ active shortener & vanity redirect domains**

---

### 🛠️ Installation Instructions
1. Download **\`toolkit-extension.zip\`** below and extract the archive to a folder.
2. Open Chromium browser (Chrome / Brave / Edge) and navigate to \`chrome://extensions\`.
3. Toggle **Developer mode** on (top-right corner).
4. Click **Load unpacked** and select the extracted folder.
EOF

          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" toolkit-extension.zip \
            --title "Toolkit Extension Release ($TAG_NAME)" \
            --notes-file release_notes.md

