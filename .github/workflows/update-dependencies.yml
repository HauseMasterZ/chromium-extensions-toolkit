name: Auto Update Upstream Dependencies

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: update-deps
  cancel-in-progress: false

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Fetch Latest DarkReader
        run: |
          echo "Fetching latest darkreader.min.js from jsDelivr..."
          rm -f Toolkit/darkreader.js.new
          if ! curl -fsSL "https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js" -o Toolkit/darkreader.js.new || grep -qiE '^[[:space:]]*(<!doctype|<html)' Toolkit/darkreader.js.new; then
            echo "Warning: DarkReader download failed or returned HTML; skipping update."
            rm -f Toolkit/darkreader.js.new
          fi
          if [ -s Toolkit/darkreader.js.new ]; then
            mv Toolkit/darkreader.js.new Toolkit/darkreader.js
            python3 .github/scripts/sanitize-darkreader.py Toolkit/darkreader.js
          else
            echo "Failed to fetch darkreader.min.js"
            rm -f Toolkit/darkreader.js.new
          fi

      - name: Fetch Latest ClearURLs Rules
        run: |
          echo "Fetching latest ClearURLs rules..."
          rm -f Toolkit/clearurls-rules.json.new
          if ! curl -fsSL "https://rules2.clearurls.xyz/data.minify.json" -o Toolkit/clearurls-rules.json.new || ! python3 -c "import json, sys; data = json.load(open(sys.argv[1], 'r', encoding='utf-8')); sys.exit(0 if isinstance(data, dict) and isinstance(data.get('providers'), dict) and len(data['providers']) > 0 else 1)" Toolkit/clearurls-rules.json.new; then
            echo "Warning: ClearURLs rules download failed or produced invalid JSON; skipping update."
            rm -f Toolkit/clearurls-rules.json.new
          fi
          if [ -s Toolkit/clearurls-rules.json.new ]; then
            mv Toolkit/clearurls-rules.json.new Toolkit/clearurls-rules.json
          else
            echo "Failed to fetch ClearURLs rules"
            rm -f Toolkit/clearurls-rules.json.new
          fi

      - name: Fetch Latest Shorteners & Clickthrough Lists
        run: |
          echo "Fetching latest shorteners from HaGeZi & AdGuard CNAME clickthroughs..."
          curl -fsSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/urlshortener-onlydomains.txt" -o hagezi_raw.txt
          curl -fsSL "https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_disguised_clickthroughs.txt" -o adguard_raw.txt
          python3 -c "
          import json, re, os
          domains = set()
          if os.path.exists('hagezi_raw.txt'):
              for line in open('hagezi_raw.txt', encoding='utf-8', errors='ignore'):
                  l = line.strip().lower()
                  if l and not l.startswith('#'):
                      domains.add(l)
              os.remove('hagezi_raw.txt')
          if os.path.exists('adguard_raw.txt'):
              for line in open('adguard_raw.txt', encoding='utf-8', errors='ignore'):
                  l = line.strip().lower()
                  if l and not l.startswith('!'):
                      clean = re.sub(r'^[\|\^]+|[\|\^]+$', '', l)
                      if clean:
                          domains.add(clean)
              os.remove('adguard_raw.txt')
          if len(domains) > 5000:
              open('Toolkit/shorteners-rules.json', 'w', encoding='utf-8').write(json.dumps(sorted(list(domains))))
              print(f'Successfully compiled {len(domains)} unique shortener and clickthrough domains.')
          "

      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up any accidental root-level duplicates or staging remnants if present
          git rm -f darkreader.js clearurls-rules.json shorteners-rules.json 2>/dev/null || true
          rm -f hagezi_raw.txt adguard_raw.txt Toolkit/darkreader.js.new Toolkit/clearurls-rules.json.new

          target_branch="${GITHUB_REF_NAME:-main}"
          git add Toolkit/darkreader.js Toolkit/clearurls-rules.json Toolkit/shorteners-rules.json
          if git diff --staged --quiet; then
            echo "No updates detected. Repository is already up-to-date."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(deps): auto-update upstream dependencies [skip ci]"
            pushed_updates=true
            if ! git push origin "HEAD:${target_branch}"; then
              echo "Initial push failed; syncing with origin/${target_branch} and retrying push..."
              if [ -f .git/shallow ]; then
                git fetch --unshallow origin
              fi
              git -c rebase.autoStash=true pull --rebase origin "${target_branch}"
              if git diff --quiet "origin/${target_branch}" HEAD; then
                echo "Remote already contained identical dependency updates after rebase."
                pushed_updates=false
              else
                git push origin "HEAD:${target_branch}"
              fi
            fi
            echo "has_updates=${pushed_updates}" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      has_updates: ${{ steps.commit_step.outputs.has_updates }}

  build-native-host:
    needs: [update-deps]
    if: needs.update-deps.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Compile Static x64 C++ Telemetry Host
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $compileArgs = "`"$vcvars`" && cl.exe /nologo /O2 /EHsc /MT /std:c++17 /W3 Toolkit\native-host\host.cpp /Fe:Toolkit\native-host\host.exe user32.lib gdi32.lib dxva2.lib setupapi.lib psapi.lib pdh.lib advapi32.lib ole32.lib oleaut32.lib wbemuuid.lib kernel32.lib"
          & cmd.exe /s /c "`"$compileArgs`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Compiled Native Host
        uses: actions/upload-artifact@v7
        with:
          name: native-host-exe
          path: Toolkit/native-host/host.exe
          if-no-files-found: error

  package-release:
    needs: [update-deps, build-native-host]
    if: needs.update-deps.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download Compiled Native Host
        uses: actions/download-artifact@v8
        with:
          name: native-host-exe
          path: Toolkit/native-host

      - name: Package Extension & Create GitHub Release
        run: |
          echo "Packaging extension into Toolkit.zip..."
          zip -r Toolkit.zip Toolkit/ -x "Toolkit/.*" -x "Toolkit/__MACOSX/*"

          TAG_NAME="v$(date -u +'%Y.%m.%d-%H%M')"
          RELEASE_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          printf "## Automated Dependencies & Engine Build\n\n" > release_notes.md
          printf "**Updated at:** \`%s\`\n\n" "$RELEASE_TIME" >> release_notes.md
          printf -- "---\n\n" >> release_notes.md
          printf "### Installation Instructions\n" >> release_notes.md
          printf "1. Download **\`Toolkit.zip\`** below and extract the archive (or download standalone **\`host.exe\`** for \`Toolkit/native-host/\`).\n" >> release_notes.md
          printf "2. Open Chromium browser (Chrome / Brave / Edge) and navigate to \`chrome://extensions\`.\n" >> release_notes.md
          printf "3. Toggle **Developer mode** on (top-right corner).\n" >> release_notes.md
          printf "4. Click **Load unpacked** and select the extracted \`Toolkit\` folder.\n" >> release_notes.md

          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" Toolkit.zip Toolkit/native-host/host.exe \
            --title "Toolkit Extension Release ($TAG_NAME)" \
            --notes-file release_notes.md

