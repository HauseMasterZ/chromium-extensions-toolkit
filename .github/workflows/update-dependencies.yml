name: Auto Update Upstream Dependencies

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest DarkReader
        run: |
          echo "Fetching latest darkreader.min.js from jsDelivr..."
          curl -sSL "https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js" -o Toolkit/darkreader.js.new
          if [ -s Toolkit/darkreader.js.new ]; then
            mv Toolkit/darkreader.js.new Toolkit/darkreader.js
            python3 -c "import re; p=r'Toolkit/darkreader.js'; c=open(p,'r',encoding='utf-8').read(); c=re.sub(r'(\(\"darkreader--proxy\"\);e\.append\(`\(\$\{es\}\)\(\$\{u\},\s*\$\{d\}\)`\),document\.head\.insertBefore\(e,l\.nextSibling\),e\.remove\(\)\})', r'(\"darkreader--proxy\");/* CSP safe */}', c); open(p,'w',encoding='utf-8').write(c)"
          else
            echo "Failed to fetch darkreader.min.js"
            rm -f Toolkit/darkreader.js.new
          fi

      - name: Fetch Latest ClearURLs Rules
        run: |
          echo "Fetching latest ClearURLs rules..."
          curl -sSL "https://rules2.clearurls.xyz/data.minify.json" -o Toolkit/clearurls-rules.json.new
          if [ -s Toolkit/clearurls-rules.json.new ]; then
            mv Toolkit/clearurls-rules.json.new Toolkit/clearurls-rules.json
          else
            echo "Failed to fetch ClearURLs rules"
            rm -f Toolkit/clearurls-rules.json.new
          fi

      - name: Fetch Latest Shorteners & Clickthrough Lists
        run: |
          echo "Fetching latest shorteners from HaGeZi & AdGuard CNAME clickthroughs..."
          curl -sSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/urlshortener-onlydomains.txt" -o hagezi_raw.txt
          curl -sSL "https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_disguised_clickthroughs.txt" -o adguard_raw.txt
          python3 -c "
          import json, re, os
          domains = set()
          if os.path.exists('hagezi_raw.txt'):
              for line in open('hagezi_raw.txt', encoding='utf-8', errors='ignore'):
                  l = line.strip().lower()
                  if l and not l.startswith('#'):
                      domains.add(l)
              os.remove('hagezi_raw.txt')
          if os.path.exists('adguard_raw.txt'):
              for line in open('adguard_raw.txt', encoding='utf-8', errors='ignore'):
                  l = line.strip().lower()
                  if l and not l.startswith('!'):
                      clean = re.sub(r'^[\|\^]+|[\|\^]+$', '', l)
                      if clean:
                          domains.add(clean)
              os.remove('adguard_raw.txt')
          if len(domains) > 5000:
              open('Toolkit/shorteners-rules.json', 'w', encoding='utf-8').write(json.dumps(sorted(list(domains))))
              print(f'Successfully compiled {len(domains)} unique shortener and clickthrough domains.')
          "

      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clean up any accidental root-level duplicates if present
          git rm -f darkreader.js clearurls-rules.json shorteners-rules.json 2>/dev/null || true
          
          git add Toolkit/darkreader.js Toolkit/clearurls-rules.json Toolkit/shorteners-rules.json
          if git diff --staged --quiet; then
            echo "No updates detected. Repository is already up-to-date."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(deps): auto-update upstream dependencies [skip ci]"
            git push
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Package Extension & Create GitHub Release
        if: steps.commit_step.outputs.has_updates == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Packaging extension into Toolkit.zip..."
          zip -r Toolkit.zip Toolkit/ -x "Toolkit/.*" -x "Toolkit/__MACOSX/*"

          TAG_NAME="v$(date -u +'%Y.%m.%d-%H%M')"
          RELEASE_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          printf "## Automated Dependencies & Engine Build\n\n" > release_notes.md
          printf "**Updated at:** \`%s\`\n\n" "$RELEASE_TIME" >> release_notes.md
          printf -- "---\n\n" >> release_notes.md
          printf "### Installation Instructions\n" >> release_notes.md
          printf "1. Download **\`Toolkit.zip\`** below and extract the archive.\n" >> release_notes.md
          printf "2. Open Chromium browser (Chrome / Brave / Edge) and navigate to \`chrome://extensions\`.\n" >> release_notes.md
          printf "3. Toggle **Developer mode** on (top-right corner).\n" >> release_notes.md
          printf "4. Click **Load unpacked** and select the extracted \`Toolkit\` folder.\n" >> release_notes.md

          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" Toolkit.zip \
            --title "Toolkit Extension Release ($TAG_NAME)" \
            --notes-file release_notes.md

