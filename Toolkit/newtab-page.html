<!DOCTYPE html>
<html lang="en" style="display: none;">
<head>
    <script src="newtab-redirect.js"></script>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <link rel="icon" href="Images/icon16.png?v=3" sizes="16x16">
    <!-- Google Fonts removed for maximum performance -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
        .links { position: absolute; top: 20px; display: flex; gap: 11px; }
        .left { left: 10px; } .right { right: 10px; gap: 11px }
        a { color: red; text-decoration: none; font-size: 17px; opacity: 0.8; cursor: pointer; }
        a:hover { opacity: 1; } a:active { color: blue; }
        .center {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .logo { max-width: 500px; width: 80%; margin-bottom: 10px; aspect-ratio: 16 / 9; object-fit: contain; }
        .search-container { position: relative; width: 50rem; max-width: 80%; }
        .search-container input { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; }
        .search-container input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: 0.6; pointer-events: none; }
        .info-panel {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0.9;
        }
        #time { font-size: 38px; font-weight: 100; font-family: "Segoe UI Light", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; margin-bottom: 12px; word-spacing: -2px; }
        .time-its { color: #ff3333; font-weight: 100; font-family: Arial, sans-serif; }
        .time-hour, .time-minute { color: #fff; }
        #weather { font-size: 15px; font-weight: 400; color: #ccc; }
        .panel-cell {
            padding: 2px 14px;
        }
        .panel-column {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .panel-column:not(:first-child) {
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }
        .panel-cell-numeric {
            cursor: ns-resize;
        }
        .panel-cell-select {
            cursor: pointer;
        }
        .panel-cell-na, .panel-cell-empty {
            cursor: default;
        }
        .panel-input {
            width: 44px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            line-height: inherit;
            font-weight: 400;
            text-align: left;
            padding: 0;
            margin: 0;
            outline: none;
            font-variant-numeric: tabular-nums;
            cursor: ns-resize;
        }
        .panel-input:focus {
            color: #ff3333;
            border-bottom: 1px solid #ff3333;
        }
        .panel-select {
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 13px;
            line-height: inherit;
            padding: 0;
            margin: 0;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }
        .panel-select:focus {
            color: #fff;
        }
        .panel-select option {
            background: #111;
            color: #fff;
        }
        /* Layout 4 Floating Micro-Pill Dock & Popover Islands */
        .peripheral-dock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
            padding: 6px 14px 4px 14px;
            box-sizing: border-box;
            width: 100%;
            user-select: none;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .peripheral-pill-wrap {
            position: relative;
            display: inline-flex;
        }
        .peripheral-micro-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 22px;
            padding: 0 9px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ccc;
            font-size: 11px;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            outline: none;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .peripheral-micro-pill:hover,
        .peripheral-pill-wrap:hover .peripheral-micro-pill,
        .peripheral-pill-wrap:focus-within .peripheral-micro-pill {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.28);
            color: #fff;
        }
        .peripheral-pill-tag {
            font-weight: 600;
            font-size: 10px;
            color: #888;
            letter-spacing: 0.5px;
            transition: color 0.15s ease;
        }
        .peripheral-micro-pill:hover .peripheral-pill-tag,
        .peripheral-pill-wrap:hover .peripheral-pill-tag,
        .peripheral-pill-wrap:focus-within .peripheral-pill-tag {
            color: #ff3333;
        }
        .peripheral-pill-batt {
            font-size: 11px;
            color: #ccc;
        }
        .peripheral-pill-indicator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .peripheral-micro-pill:hover .peripheral-pill-indicator,
        .peripheral-pill-wrap:hover .peripheral-pill-indicator,
        .peripheral-pill-wrap:focus-within .peripheral-pill-indicator {
            background: #ff3333;
            transform: scale(1.25);
        }
        .peripheral-popover {
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%) translateY(4px) scale(0.98);
            width: 224px;
            padding: 10px 12px;
            border-radius: 6px;
            background: rgba(12, 12, 12, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            contain: layout style;
            text-align: left;
            white-space: normal;
            transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.15s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.15s;
            will-change: opacity, transform;
        }
        /* Invisible Hover Bridge connecting pill to popover */
        .peripheral-popover::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            height: 10px;
            background: transparent;
            pointer-events: auto;
        }
        .peripheral-pill-wrap:hover .peripheral-popover,
        .peripheral-pill-wrap:focus-within .peripheral-popover,
        .peripheral-popover:hover {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
            transition-delay: 0s;
        }
        .peripheral-popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .peripheral-popover-title {
            font-size: 11px;
            font-weight: 500;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .peripheral-popover-badge {
            font-size: 10px;
            color: #888;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            padding: 1px 5px;
            white-space: nowrap;
        }
        .peripheral-popover-configs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        .peripheral-config-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 0;
            border-radius: 3px;
            font-size: 10px;
            font-family: inherit;
            font-weight: 400;
            color: #888;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            outline: none;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }
        .peripheral-config-btn:hover:not(.active) {
            color: #ccc;
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        .peripheral-config-btn.active {
            color: #fff;
            font-weight: 500;
            border-color: #ff3333;
            background: rgba(255, 51, 51, 0.12);
            cursor: default;
        }
        .peripheral-popover-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px 12px;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }
        .peripheral-stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
        }
        .peripheral-stat-lbl {
            color: #777;
            margin-right: 6px;
        }
        .peripheral-stat-val {
            color: #ccc;
        }
        #mouse-controls, .mouse-controls {
            display: none !important;
        }
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999999;
            display: none;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }
        .blackout-overlay.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="links left">
        <a id="link-l">L</a> <a id="link-m">M</a> <a id="link-r">R</a>
    </div>
    <div class="links right">
        <a href="https://hausemasterz.github.io/youtube/">Music</a>
        <a href="https://app.notesnook.com/notes">Notesnook</a>
        <a href="https://v3-hub.atk.store/">ATK</a>
        <a href="https://www.mchose.com.cn/#/connectDevice">Mchose</a>
        <a href="https://youtube.com">YouTube</a>
        <a href="https://mail.google.com/mail/u/0/#inbox">Gmail</a>
    </div>
    <div class="center">
        <img class="logo" src="Images/rogreflect.jpg" alt="Logo" decoding="async">
        <form class="search-container" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="Search..." autocomplete="off">
            <span class="search-icon"><img src="Images/search.svg" alt="Search" decoding="async"></span>
        </form>
        <div class="info-panel" id="info-panel">
            <div id="time"></div>
            <div id="weather"></div>
            <div id="hardware" style="display: none; font-size: 13px; font-weight: 400; color: #ccc;">
                <table style="table-layout: fixed; width: 750px; margin: 0 auto; border-collapse: collapse; font-size: 13px; line-height: 1.35; color: #ccc; text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap;">
                    <colgroup>
                        <col style="width: 250px;">
                        <col style="width: 250px;">
                        <col style="width: 250px;">
                    </colgroup>
                    <thead>
                        <tr style="color: #fff;">
                            <th style="padding: 2px 14px 3px 14px; font-weight: normal;">CPU</th>
                            <th style="padding: 2px 14px 3px 14px; font-weight: normal; border-left: 1px solid rgba(255, 255, 255, 0.12);">GPU</th>
                            <th style="padding: 2px 14px 3px 14px; font-weight: normal; border-left: 1px solid rgba(255, 255, 255, 0.12);">TJMax</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="tc-c1" style="padding: 2px 14px; overflow: hidden;">Load: --% &nbsp;|&nbsp; -- MHz</td>
                            <td id="tc-g1" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">Load: --% &nbsp;|&nbsp; Core clk: -- MHz</td>
                            <td id="tc-o1" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">P-State: --</td>
                        </tr>
                        <tr>
                            <td id="tc-c2" style="padding: 2px 14px; overflow: hidden;">P: -- GHz | E: -- GHz</td>
                            <td id="tc-g2" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">Mem clk: -- MHz &nbsp;|&nbsp; Temp: --&deg;C</td>
                            <td id="tc-o2" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">CPU Throttle: --</td>
                        </tr>
                        <tr>
                            <td id="tc-c3" style="padding: 2px 14px; overflow: hidden;">PKG: --W &nbsp;|&nbsp; Temp: --&deg;C</td>
                            <td id="tc-g3" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">iGPU: --W (--) &nbsp;|&nbsp; dGPU: --W</td>
                            <td id="tc-o3" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">GPU: -- &nbsp;|&nbsp; VRM: --</td>
                        </tr>
                        <tr>
                            <td id="tc-c4" style="padding: 2px 14px; overflow: hidden;">RAM: --</td>
                            <td id="tc-g4" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">VRAM: --</td>
                            <td id="tc-o4" style="padding: 2px 14px; border-left: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;">Page: --</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="panel-controls" style="display: none; font-size: 13px; font-weight: 400; color: #ccc;"></div>
        </div>
    </div>
    <div id="blackout-overlay" class="blackout-overlay" aria-hidden="true"></div>
    <script src="newtab-script.js"></script>
</body>
</html>
