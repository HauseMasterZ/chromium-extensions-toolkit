<!DOCTYPE html>
<html lang="en" style="display: none;">
<head>
    <script src="newtab-redirect.js"></script>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <link rel="icon" href="Images/icon16.png?v=3" sizes="16x16">
    <!-- Google Fonts removed for maximum performance -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
        .links { position: absolute; top: 20px; display: flex; gap: 11px; }
        .left { left: 10px; } .right { right: 10px; gap: 11px }
        a { color: red; text-decoration: none; font-size: 17px; opacity: 0.8; cursor: pointer; }
        a:hover { opacity: 1; } a:active { color: blue; }
        .center {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .logo { max-width: 500px; width: 80%; margin-bottom: 10px; aspect-ratio: 16 / 9; object-fit: contain; }
        .search-container { position: relative; width: 50rem; max-width: 80%; }
        .search-container input { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; }
        .search-container input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: 0.6; pointer-events: none; }
        .info-panel {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0.9;
        }
        #time { font-size: 38px; font-weight: 100; font-family: "Segoe UI Light", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; margin-bottom: 12px; word-spacing: -2px; }
        .time-its { color: #ff3333; font-weight: 100; font-family: Arial, sans-serif; }
        .time-hour, .time-minute { color: #fff; }
        #weather { font-size: 15px; font-weight: 400; color: #ccc; }
        .panel-cell {
            padding: 2px 14px;
        }
        .panel-column:not(:first-child) {
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }
        .panel-cell-numeric {
            cursor: ns-resize;
        }
        .panel-cell-select {
            cursor: pointer;
        }
        .panel-cell-na, .panel-cell-empty {
            cursor: default;
        }
        .panel-input {
            width: 44px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            line-height: inherit;
            font-weight: 400;
            text-align: left;
            padding: 0;
            margin: 0;
            outline: none;
            font-variant-numeric: tabular-nums;
            cursor: ns-resize;
        }
        .panel-input:focus {
            color: #ff3333;
            border-bottom: 1px solid #ff3333;
        }
        .panel-select {
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 13px;
            line-height: inherit;
            padding: 0;
            margin: 0;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }
        .panel-select:focus {
            color: #fff;
        }
        .panel-select option {
            background: #111;
            color: #fff;
        }
        .mouse-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #ccc;
            font-variant-numeric: tabular-nums;
            user-select: text;
            line-height: 1.35;
        }
        .mouse-configs-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            user-select: none;
        }
        .mouse-config-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 9px;
            border-radius: 3px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 400;
            color: #888;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            user-select: none;
            letter-spacing: 0.2px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }
        .mouse-config-chip:hover:not(.active) {
            color: #ccc;
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.08);
        }
        .mouse-config-chip.active {
            color: #fff;
            font-weight: 500;
            border: 1px solid #ff3333;
            background: rgba(255, 51, 51, 0.08);
            cursor: default;
        }
        .mouse-config-chip:disabled {
            cursor: default;
        }
        .mouse-expand-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #888;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .mouse-expand-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        .mouse-expand-icon {
            display: block;
            width: 10px;
            height: 10px;
            transition: transform 0.2s ease;
        }
        .mouse-expand-btn.expanded .mouse-expand-icon {
            transform: rotate(180deg);
        }
        .mouse-stats-panel {
            display: none;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 20px;
            margin-top: 6px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-size: 12px;
            text-align: left;
            min-width: 300px;
            box-sizing: border-box;
            user-select: text;
        }
        .mouse-stats-panel.expanded {
            display: grid;
        }
        .mouse-stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            white-space: nowrap;
        }
        .mouse-stat-label {
            color: #777;
        }
        .mouse-stat-value {
            color: #ccc;
            font-variant-numeric: tabular-nums;
        }
        .mouse-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 3px;
            color: #ddd;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s ease;
        }
        .mouse-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        .mouse-btn:active {
            background: rgba(255, 255, 255, 0.22);
        }
    </style>
</head>
<body>
    <div class="links left">
        <a id="link-l">L</a> <a id="link-m">M</a> <a id="link-r">R</a>
    </div>
    <div class="links right">
        <a href="https://hausemasterz.github.io/youtube/">Music</a>
        <a href="https://app.notesnook.com/notes">Notesnook</a>
        <a href="https://v3-hub.atk.store/">ATK</a>
        <a href="https://www.mchose.com.cn/#/connectDevice">Mchose</a>
        <a href="https://youtube.com">YouTube</a>
        <a href="https://mail.google.com/mail/u/0/#inbox">Gmail</a>
    </div>
    <div class="center">
        <img class="logo" src="Images/rogreflect.jpg" alt="Logo" decoding="async">
        <form class="search-container" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="Search..." autocomplete="off">
            <span class="search-icon"><img src="Images/search.svg" alt="Search" decoding="async"></span>
        </form>
        <div class="info-panel" id="info-panel">
            <div id="time"></div>
            <div id="weather"></div>
            <div id="hardware" style="display: none; font-size: 13px; font-weight: 400; color: #ccc;"></div>
            <div id="panel-controls" style="display: none; font-size: 13px; font-weight: 400; color: #ccc;"></div>
            <div id="mouse-controls" class="mouse-controls"></div>
        </div>
    </div>
    <script src="newtab-script.js"></script>
</body>
</html>
